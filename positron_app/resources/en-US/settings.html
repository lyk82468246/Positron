<!doctype html><html lang="en-US"><head><title>Settings</title></head>
<body class="internal">
<h1>Settings</h1><p>The startup page is saved in positron.db beside this application. Other values are read-only.</p><!--APP_CONTENT-->
<p><label for="settings-startup">Startup page / Home</label></p>
<p><select id="settings-startup" disabled><option id="settings-option-newtab" value="positron://newtab">New page</option><option id="settings-option-welcome" value="positron://welcome">Welcome</option><option id="settings-option-controls" value="positron://controls">Controls</option></select></p>
<p><button id="settings-save" type="button" disabled>Save</button></p>
<p id="settings-status">Storage unavailable. No preferences will be saved.</p>
<h2>Internal pages</h2>
<p><a id="nav-newtab" href="positron://newtab">New page</a></p>
<p><a id="nav-about" href="positron://about">About Positron</a></p>
<p><a id="nav-history" href="positron://history">Session history</a></p>
<p><a id="nav-downloads" href="positron://downloads">Downloads</a></p>
<p><a id="nav-settings" href="positron://settings">Settings</a></p>
<p><a id="nav-welcome" href="positron://welcome">Welcome</a></p>
<p><a id="nav-controls" href="positron://controls">Controls</a></p>
<script>
(function () {
    var choice = document.getElementById('settings-startup');
    var button = document.getElementById('settings-save');
    var status = document.getElementById('settings-status');
    var busy = true;
    function enable() {
        busy = false;
        choice.removeAttribute('disabled');
        button.removeAttribute('disabled');
    }
    button.addEventListener('click', function () {
        if (busy) return;
        busy = true;
        choice.setAttribute('disabled', '');
        button.setAttribute('disabled', '');
        status.textContent = 'Saving...';
        try {
            PositronServices.request('settings.write', {startupPage: choice.value}, function (ok, value) {
                status.textContent = ok ? 'Saved. Applies to Home and the next launch.' : 'Save failed. Previous preference retained.';
                enable();
            });
        } catch (error) { status.textContent = 'Storage unavailable. Previous preference retained.'; }
    });
    try {
        PositronServices.request('settings.read', {}, function (ok, value) {
            if (!ok) { status.textContent = 'Cannot read preferences. Existing file retained.'; return; }
            choice.value = value.startupPage;
            status.textContent = 'Choose a startup page, then Save.';
            enable();
        });
    } catch (error) { status.textContent = 'Storage unavailable. No preferences will be saved.'; }
}());
</script></body></html>
