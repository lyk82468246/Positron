<!doctype html><html lang="zh-CN"><head><title>键盘和焦点</title></head>
<body><h1>键盘和焦点</h1>
<p>Tab 会在原生应用控件之间移动。当页面拥有焦点时，向上和向下方向键会访问这些链接，Enter 会激活当前链接。</p>
<p>向左和向右方向键水平滚动。Page Up 和 Page Down 垂直滚动。Escape 不会意外变成历史记录返回操作。</p>
<p><a id="welcome" tabindex="0"
href="https://positron.local/welcome">返回欢迎页面</a></p>
<p><a id="welcome2" tabindex="0"
href="https://positron.local/welcome">使用第二个链接返回</a></p>
<h2>输入约定</h2>
<p>地址栏使用原生 EDIT 控件。Enter 提交地址，Escape 恢复最近一次提交的地址。Backspace 仍然是 EDIT 控件的删除键。</p>
<p>原生文本字段、SELECT 控件、SIP 和文件选择将在下一次输入批次中接入此外壳。</p>
<p><a id="home" tabindex="0"
href="https://positron.local/welcome">主页</a></p>
</body></html>
